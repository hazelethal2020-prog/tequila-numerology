<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生命靈數｜Tequila</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Noto+Sans+TC:wght@400;500;700;900&family=Anton&family=Caveat:wght@700&family=Special+Elite&family=LXGW+WenKai+TC:wght@700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Tequila 生命靈數：與星象月曆同色系，但版面不同 —— 置中圖像 logo、塔羅牌框紙卡、序號徽章、漂浮數字背景。 */
:root{
  color-scheme:dark;
  --bg:#2d1932; --deep:#1c0f20; --surface:#3a2340; --ink:#f5ecd9; --muted:#c4b4c8; --line:#5a4260;
  --gold:#eac063; --gold2:#86601a; --paper:#f6f2ea; --plum:#2d1932; --red:#b8452f; --lav:#7a5784;
  --mark:"UnifrakturMaguntia","Old English Text MT",serif;
  --body:"GenSenRounded TW","jf-openhuninn-2.0","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--deep)}
body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#46284f 0%,#2d1932 45%,#1c0f20 100%) fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:34px 16px 140px;display:flex;flex-direction:column;gap:40px}
p{margin:0}
button,select,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#result:focus{outline:none}

/* 頁首：置中 logo */
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:6px}
.logo{width:184px;height:auto;display:block;filter:drop-shadow(0 4px 18px rgba(234,192,99,.25))}
.logo path{fill:var(--gold)}
h1{margin:6px 0 0;display:flex;align-items:center;gap:14px;font-size:30px;font-weight:900;letter-spacing:.18em;line-height:1.2}
h1::before,h1::after{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
h1::after{transform:scaleX(-1)}
.tagx{font-size:12px;letter-spacing:.42em;color:var(--gold);padding-left:.42em}
.sub{color:var(--muted);font-size:14px}
header .sub{max-width:34em}

/* 紙卡：塔羅牌框 + 頂端序號徽章 */
.panel{--ink:#2d1932;--muted:#5f4e64;--line:#ddd3c3;color:var(--ink);position:relative;background:var(--paper);border-radius:20px;padding:44px 20px 24px;box-shadow:0 14px 34px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px;color-scheme:light}
.panel::before{content:"";position:absolute;inset:8px;border:1px solid rgba(154,111,31,.35);border-radius:14px;pointer-events:none}
.panel :focus-visible{outline-color:var(--plum)}
.idx{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:46px;height:46px;border-radius:50%;background:var(--plum);border:2px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-family:var(--mark);font-size:26px;line-height:1;padding-top:2px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.eyebrow{text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.32em;color:var(--gold2);margin-bottom:-10px}
.panel>h2{margin:0;text-align:center;font-size:23px;font-weight:900;line-height:1.35;text-wrap:balance;letter-spacing:.04em}
.panel>.sub{text-align:center}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold2);font-size:11px;margin:-4px 0}
.orn::before,.orn::after{content:"";width:60px;height:1px;background:linear-gradient(90deg,transparent,rgba(154,111,31,.6))}
.orn::after{transform:scaleX(-1)}
.lh{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.howto{font-size:12.5px;color:var(--muted);line-height:1.6}
.none{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:#fff}

/* 表單 */
label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
select,input[type=number],input[type=text]{height:46px;font-size:16px;border:1px solid #bdb2a3;border-radius:10px;background:#fff;color:var(--ink);padding:0 10px;min-width:0;width:100%}
.r3{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.go{align-self:center;height:48px;border:0;border-radius:999px;background:linear-gradient(180deg,#3d2346,#2d1932);color:var(--gold);font-weight:700;letter-spacing:.1em;padding:0 32px;font-size:15.5px;box-shadow:0 4px 0 #1c0f20,inset 0 0 0 1px rgba(234,192,99,.35)}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #1c0f20,inset 0 0 0 1px rgba(234,192,99,.35)}
.msg{background:#fff;border-left:4px solid var(--red);border-radius:6px;padding:8px 12px;font-size:14px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:6px 14px;font-size:14px;min-height:44px;align-self:center}

/* 主命數 */
.num{display:flex;flex-direction:column;align-items:center;gap:2px}
.chain{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.chain b{color:var(--plum)}
.big{position:relative;width:170px;height:170px;display:grid;place-items:center;margin:6px auto 0}
.big svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.big .ring{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linecap:round}
.big .ring2{fill:none;stroke:var(--plum);stroke-width:1;opacity:.22}
.big .n{position:relative;font-family:var(--mark);font-size:104px;line-height:1;color:var(--plum);transform:translateY(5px)}
.title{text-align:center;font-size:25px;font-weight:900;line-height:1.35;margin-top:2px}
.title small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.14em}
.master{align-self:center;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold);background:rgba(234,192,99,.16);color:#7a5413;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.kw{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.kw span{border:1px solid #cdbf9d;border-radius:999px;padding:0 11px;font-size:13px;line-height:1.85;background:#fff}
.lead{font-size:15px;line-height:1.8;max-width:60ch;margin:0 auto}
.note2{font-size:13.5px;color:#5f4e64;line-height:1.7}

/* 四大面向：有標頭的卡 */
.facets{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fc{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.fh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(135deg,#3d2346,#2d1932);color:var(--gold)}
.fh svg{flex:none;width:30px;height:30px;padding:6px;border-radius:50%;background:rgba(234,192,99,.14);box-shadow:inset 0 0 0 1px rgba(234,192,99,.5)}
.fh b{display:block;font-size:16px;letter-spacing:.08em;line-height:1.3}
.fh small{display:block;font-size:10.5px;letter-spacing:.24em;color:var(--muted);line-height:1.4}
.fc p{padding:12px 14px 14px;font-size:14.5px;line-height:1.75;color:#3d2c42}

/* 塔羅與小酒 */
.tbox{display:grid;grid-template-columns:96px 1fr;gap:6px 16px;align-items:center;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px}
.tcard{position:relative;width:96px;aspect-ratio:2/3;border-radius:7px;background:var(--plum);box-shadow:0 4px 12px rgba(45,25,50,.28);overflow:hidden}
.tface{position:absolute;inset:5px;border:1px solid var(--gold);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 4px 8px;color:var(--gold);text-align:center}
.tface .tnum{font-family:var(--mark);font-size:18px;line-height:1.1}
.tface .tsym{font-size:28px;line-height:1;opacity:.9}
.tface .tzh{font-size:12.5px;font-weight:700;letter-spacing:.08em;line-height:1.3}
.tlbl{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.tname{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin-top:2px}
.tname b{font-size:20px;line-height:1.35}
.tname .ten{font-size:13px;color:var(--muted)}
.ttxt{margin-top:6px;font-size:14px;line-height:1.65}
.drink{display:flex;gap:12px;align-items:center;background:var(--plum);color:var(--ink);border-radius:14px;padding:12px 14px}
.drink svg{flex:none}
.drink b{color:var(--gold)}
.drink p{font-size:14px;line-height:1.6}
.drink .dl0{font-size:12px;letter-spacing:.16em;color:var(--muted)}

/* 幸運色：整格上色＋閃閃水晶 */
.luck2{--c:#ebe7de;--fg:#2d1932;position:relative;overflow:hidden;border-radius:16px;padding:16px;color:var(--fg);background:radial-gradient(140% 120% at 0% 0%,color-mix(in srgb,var(--c) 70%,#fff) 0%,var(--c) 45%,color-mix(in srgb,var(--c) 72%,#000) 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 6px 18px color-mix(in srgb,var(--c) 40%,transparent)}
.luck2::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 85% 20%,rgba(255,255,255,.14) 0 2px,transparent 2px 22px);pointer-events:none}
.luck2 .lt{position:relative;display:flex;align-items:center;gap:12px}
.luck2 .orb{flex:none;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0 8%,color-mix(in srgb,var(--c) 60%,#fff) 22%,var(--c) 60%,color-mix(in srgb,var(--c) 60%,#000) 100%);box-shadow:0 0 0 3px rgba(255,255,255,.5),0 6px 14px rgba(0,0,0,.25)}
.luck2 .ll{display:block;font-size:11.5px;font-weight:700;letter-spacing:.24em;opacity:.8}
.luck2 .cn{font-size:24px;font-weight:900;line-height:1.3}
.luck2 .ef{font-size:13.5px;opacity:.9}
.gems{position:relative;display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.gem{--g:var(--c);position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:7px;padding:6px 14px 6px 9px;border-radius:999px;background:rgba(255,255,255,.92);color:#2d1932;font-size:15.5px;font-weight:700;letter-spacing:.04em;box-shadow:0 2px 8px rgba(0,0,0,.15),inset 0 0 0 1px rgba(255,255,255,.9)}
.gem svg{flex:none;width:20px;height:20px;color:var(--g);filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.gem::after{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(105deg,transparent 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,.95) 50%,rgba(255,255,255,0) 70%,transparent 100%);transform:translateX(-160%) skewX(-12deg);animation:shine 3.2s ease-in-out infinite;animation-delay:var(--d,0s);pointer-events:none}
.gem .tw{position:absolute;top:1px;right:5px;font-size:10px;line-height:1;color:#fff;text-shadow:0 0 4px var(--g),0 0 8px #fff;animation:twinkle 1.8s ease-in-out infinite;animation-delay:var(--d,0s)}
.gem .tw2{top:auto;bottom:2px;right:auto;left:26px;font-size:8px;animation-delay:calc(var(--d,0s) + .9s)}
@keyframes shine{0%,55%{transform:translateX(-160%) skewX(-12deg)}85%,100%{transform:translateX(260%) skewX(-12deg)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(45deg)}}

/* 九宮格 */
.gridwrap{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:18px;align-items:start}
.nine{position:relative;width:100%;aspect-ratio:1;background:#fff;border:1px solid var(--line);border-radius:16px}
.nine svg{position:absolute;inset:0;width:100%;height:100%}
.nine .cellbg{fill:#faf7f0;stroke:#e5ddcf}
.nine .lnk{stroke:var(--gold);stroke-width:7;stroke-linecap:round;opacity:.9;fill:none}
.nine .lnk.draw{stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation:draw .8s ease forwards;animation-delay:var(--d)}
.nine .dg{font-family:var(--body);font-size:30px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.nine .dg.on{fill:var(--plum)}
.nine .dg.off{fill:#cfc6b8}
.nine .cir{fill:none;stroke:var(--plum);stroke-width:2}
.nine .cnt{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
.nine .cntbg{fill:var(--red)}
.nine .gp{opacity:0;animation:pop .35s ease forwards;animation-delay:var(--d);transform-box:fill-box;transform-origin:center}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.lines{display:flex;flex-direction:column;gap:8px}
.ln{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.ln:first-of-type{border-top:0}
.ln .lt{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:15px;white-space:nowrap}
.ln .lt span{font-variant-numeric:tabular-nums;background:var(--gold);color:var(--plum);border-radius:4px;padding:0 6px;font-size:12.5px}
.ln p{grid-column:1/-1;font-size:14px;line-height:1.65;color:#3d2c42}

/* 空缺數：重新規劃成彩色卡 */
.missgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mc{--c:#ccc;--fg:#fff;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 4px 12px rgba(45,25,50,.08)}
.mc .mt{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;color:var(--fg);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 75%,#000))}
.mc .mt::after{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 90% 10%,rgba(255,255,255,.14) 0 2px,transparent 2px 18px);pointer-events:none}
.mc .mn{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--mark);font-size:34px;line-height:1;background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 2px rgba(255,255,255,.65)}
.mc .mh b{display:block;font-size:17px;font-weight:900;line-height:1.3}
.mc .mh small{display:block;font-size:13px;opacity:.92;font-weight:700}
.mc .mb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.mc .gems{margin-top:0}
.mc .gem{background:color-mix(in srgb,var(--c) 10%,#fff);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 45%,#fff)}
.mc p{font-size:14px;line-height:1.7;color:#3d2c42}
.mc .ml{font-size:11.5px;font-weight:700;letter-spacing:.2em;color:var(--muted)}

/* 帶走自己：小預覽 */
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.thumb{background:none;border:0;padding:0;display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--ink);font-weight:700;font-size:14px}
.thumb .tf{position:relative;width:100%;aspect-ratio:90/54;border-radius:8px;overflow:hidden;box-shadow:0 8px 20px rgba(45,25,50,.3);transition:transform .25s;background:#e8e1d6}
.thumb:nth-child(1) .tf{transform:rotate(-3deg)}
.thumb:nth-child(2) .tf{transform:rotate(3deg)}
.thumb:hover .tf,.thumb:focus-visible .tf{transform:translateY(-4px) rotate(0)}
.thumb img{display:block;width:100%;height:100%}
.thumb small{font-weight:500;color:var(--muted);font-size:12px;margin-top:-6px}
.take{align-self:center;height:54px;border:0;border-radius:999px;background:linear-gradient(180deg,#f3d58a,#e2b04c);color:var(--plum);font-weight:900;font-size:17px;letter-spacing:.12em;padding:0 34px;box-shadow:0 5px 0 #a87d2a,0 10px 24px rgba(234,192,99,.35)}
.take:active{transform:translateY(3px);box-shadow:0 2px 0 #a87d2a}
.editor{display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--line);padding-top:16px}
.styles{display:flex;gap:6px;justify-content:center}
.styles button,.yrs button{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--plum);background:#fff;color:var(--plum);font-weight:700;font-size:14px}
.styles button[aria-pressed=true],.yrs button[aria-pressed=true]{background:var(--plum);color:var(--gold)}
.nmrow{max-width:360px;width:100%;margin:0 auto}
.phrow{max-width:360px;width:100%;margin:10px auto 0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.phrow[hidden]{display:none!important}.phrow small{opacity:.7;font-size:12px}
.phbtns{display:flex;gap:8px}.phbtns>*{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:999px;border:1.5px solid var(--gold);background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer}
.phbtns>[aria-pressed="true"]{background:var(--gold);color:#2d1932}
.flip{width:100%;max-width:520px;margin:4px auto 0;aspect-ratio:90/54;perspective:1400px;background:none;border:0;padding:0}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.back .in{transform:rotateY(180deg)}
.flip img{position:absolute;inset:0;width:100%;height:100%;border-radius:3.5%/5.8%;box-shadow:0 12px 28px rgba(45,25,50,.35);backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#ddd}
.flip img.b{transform:rotateY(180deg)}
.fliphint{text-align:center;font-size:12.5px;color:var(--muted)}
.dlrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dl{height:44px;border-radius:999px;border:1.5px solid var(--plum);background:#fff;color:var(--plum);font-weight:700;padding:0 18px;font-size:14px}
.dl.pri{background:var(--plum);color:var(--gold);border-color:var(--plum)}
.dl:disabled{opacity:.5;cursor:default}
.dlmsg{text-align:center;font-size:13px;font-weight:700;min-height:1.4em;color:#1d6b3a}
.dlmsg.no{color:var(--red)}

/* 流年流月 */
.yrs{display:flex;gap:6px;justify-content:center}
.yrs button .lk{font-size:11px;margin-left:4px;opacity:.75}
.py{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.py .pn{width:92px;height:92px;border-radius:50%;background:var(--plum);color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:inset 0 0 0 2px rgba(234,192,99,.45)}
.py .pn b{font-family:var(--mark);font-size:50px;font-weight:400}
.py .pn small{font-size:11px;letter-spacing:.14em;color:#d9cbdc;margin-top:4px}
.py h3{margin:0;font-size:18px}
.py .pk{font-size:13px;font-weight:700;color:var(--gold2);margin-top:2px}
.py p{font-size:14px;line-height:1.65;margin-top:6px}
.cycle{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:2px}
.cycle span{height:26px;border-radius:6px;background:#e9e2d6;color:#7d6f82;font-size:12px;font-weight:700;display:grid;place-items:center}
.cycle span.on{background:var(--gold);color:var(--plum)}
.cyclelbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.months button{display:flex;flex-direction:column;align-items:center;min-height:58px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 0;line-height:1.25}
.months button small{font-size:11.5px;color:var(--muted)}
.months button b{font-size:20px;font-variant-numeric:tabular-nums}
.months button.now{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.months button.now small{color:var(--gold2);font-weight:700}
.months button[aria-pressed=true]{background:var(--plum);border-color:var(--plum);color:var(--gold)}
.months button[aria-pressed=true] small{color:#d9cbdc}
.mout{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.65}
.mout b{display:block;font-size:15px;margin-bottom:2px}
.soon{position:relative;border-radius:16px;overflow:hidden;min-height:340px}
.soon .blur{filter:blur(7px);opacity:.6;pointer-events:none;user-select:none;display:flex;flex-direction:column;gap:12px}
.soon .veil{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:radial-gradient(circle at 50% 50%,rgba(246,242,234,.6),rgba(246,242,234,.92) 70%)}
.soon .veil .ic{width:58px;height:58px;border-radius:50%;background:var(--plum);color:var(--gold);display:grid;place-items:center;box-shadow:0 0 0 6px rgba(234,192,99,.25);animation:pulse 2.4s ease-in-out infinite}

.soon .veil p{font-size:14px;color:var(--muted);max-width:22em}
.soon .veil{overflow:hidden}
.soon .veil .spk{position:absolute;width:16px;height:16px;pointer-events:none;background:conic-gradient(from 45deg,transparent 0 25%,#c86fb0 0 25.5%,transparent 0 50%,#c86fb0 0 50.5%,transparent 0 75%,#c86fb0 0 75.5%,transparent 0);
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);background:radial-gradient(circle,#fff 0 18%,#e48cc8 30%,#a65fd6 70%);filter:drop-shadow(0 0 6px rgba(214,120,200,.9));animation:twinkle 2.6s ease-in-out infinite;opacity:0}
.soon .veil .spk:nth-child(1){left:9%;top:14%;animation-delay:0s}
.soon .veil .spk:nth-child(2){left:84%;top:12%;width:22px;height:22px;animation-delay:.5s}
.soon .veil .spk:nth-child(3){left:16%;top:62%;width:12px;height:12px;animation-delay:1.1s}
.soon .veil .spk:nth-child(4){left:90%;top:56%;animation-delay:1.6s}
.soon .veil .spk:nth-child(5){left:30%;top:6%;width:11px;height:11px;animation-delay:.8s}
.soon .veil .spk:nth-child(6){left:70%;top:84%;width:20px;height:20px;animation-delay:2s}
.soon .veil .spk:nth-child(7){left:6%;top:86%;animation-delay:1.3s}
.soon .veil .spk:nth-child(8){left:62%;top:4%;width:13px;height:13px;animation-delay:.3s}
.soon .veil .spk:nth-child(9){left:40%;top:90%;width:12px;height:12px;animation-delay:1.9s}
.soon .veil .spk:nth-child(10){left:78%;top:34%;width:10px;height:10px;animation-delay:2.3s}
.soon .veil .launch{display:inline-block;padding:5px 14px;border-radius:999px;font-weight:900;font-size:14px;letter-spacing:.12em;color:#fff;background:linear-gradient(110deg,#a65fd6,#d96fae,#a65fd6);background-size:200% 100%;animation:launchShine 3s linear infinite;box-shadow:0 4px 14px rgba(166,95,214,.35)}
.soon .veil .pre{font-size:13px;color:#8a3f7a;font-weight:700}
@keyframes launchShine{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.soon .veil .spk{animation:none;opacity:.8}.soon .veil .launch{animation:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 6px rgba(234,192,99,.25)}50%{box-shadow:0 0 0 14px rgba(234,192,99,.08)}}

/* 配對 */
.pair{display:flex;flex-direction:column;gap:10px}
.pres{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.pp{text-align:center}
.pp .c{width:64px;height:64px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-family:var(--mark);font-size:38px;background:var(--plum);color:var(--gold)}
.pp.b .c{background:var(--gold);color:var(--plum)}
.pp small{display:block;margin-top:4px;font-size:12.5px;color:var(--muted)}
.pp b{font-size:14.5px}
.heart{font-family:var(--mark);font-size:28px;color:var(--gold2)}
.ptxt{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;font-size:14px;line-height:1.7}
.ptxt h4{margin:0 0 2px;font-size:15.5px}
.ptxt .score{display:inline-block;margin-left:6px;background:var(--gold);color:var(--plum);border-radius:4px;padding:0 6px;font-size:12.5px;font-weight:700;vertical-align:2px}

/* 付費深度解析 */
.paid .chainbig{text-align:center;font-family:var(--mark);font-size:48px;line-height:1;color:var(--plum)}
.paid .pname{text-align:center;font-size:19px;font-weight:900;margin-top:-4px}
.toc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.toc span{font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 9px;line-height:1.8}
.teaser{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;overflow:hidden}
.teaser p{font-size:14.5px;line-height:1.75}
.fog{margin-top:10px;display:flex;flex-direction:column;gap:9px;filter:blur(3px);opacity:.55}
.fog i{display:block;height:11px;border-radius:6px;background:#d9cfc0}
.fog i:nth-child(2){width:92%}.fog i:nth-child(3){width:80%}.fog i:nth-child(4){width:88%}.fog i:nth-child(5){width:60%}
.teaser::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(rgba(255,255,255,0),#fff)}
.lockbox{--muted:#c4b4c8;--ink:#f5ecd9;background:var(--plum);color:var(--ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;color-scheme:dark}
.lockbox .lt2{display:flex;gap:8px;align-items:center;font-weight:700;color:var(--gold)}
.lockbox p{font-size:13.5px;color:var(--muted)}
.lockbox form{display:flex;gap:8px}
.lockbox input{flex:1;min-width:0;height:44px;border-radius:8px;border:1px solid #6d5273;background:#22122a;color:var(--ink);padding:0 12px;font-size:16px;letter-spacing:.08em}
.lockbox input::placeholder{color:#8f7d94}
.lockbox .ubtn{height:44px;padding:0 18px;border:0;border-radius:8px;background:var(--gold);color:var(--plum);font-weight:700}
.lockbox .um{font-size:13.5px;font-weight:700}
.lockbox .um:empty{display:none}
.lockbox .um.no{color:#f0a08f}
.lockbox .buy{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:12px;text-decoration:none;font-weight:900;font-size:16px;letter-spacing:.08em;background:linear-gradient(180deg,#f3d58a,#e2b04c);color:var(--plum);box-shadow:0 4px 0 #a87d2a,0 8px 20px rgba(234,192,99,.25);position:relative;overflow:hidden}
.lockbox .buy::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-150%) skewX(-12deg);animation:shine 3.6s ease-in-out infinite}
.lockbox .buyalt{font-size:12.5px;text-align:center}
.lockbox .buyalt a{color:var(--gold)}
.lockbox .have{margin-top:6px;padding-top:12px;border-top:1px dashed #5a4260;font-size:13.5px;font-weight:700;color:var(--ink)}
.okbar{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13.5px;font-weight:700;color:#1d6b3a}
.pick{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13.5px;color:var(--muted)}
.pick select{width:auto;height:40px}
.rd h3{margin:18px 0 6px;font-size:16px;display:flex;align-items:center;gap:8px}
.rd h3::before{content:"✦";color:#b8862b;font-size:13px}
.rd h3:first-child{margin-top:4px}
.rd p{font-size:14.5px;line-height:1.8}
.rd ul{margin:0;padding-left:1.2em;font-size:14.5px;line-height:1.8}
.digits{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.digits .dgt{display:flex;flex-direction:column;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:76px}
.digits .dgt b{font-family:var(--mark);font-size:30px;line-height:1.1;color:var(--plum)}
.digits .dgt small{font-size:12px;color:var(--muted)}
.digits .op{font-size:20px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.two h4{margin:0 0 4px;font-size:14.5px}
.jobs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.jobs span{font-size:13px;background:var(--plum);color:var(--gold);border-radius:6px;padding:1px 9px}
.luck{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sw{width:46px;height:46px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(45,25,50,.18),0 0 0 3px #fff,0 0 0 4px var(--c)}
.luck .ll{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.luck p{font-size:14.5px;line-height:1.6}
.letter{margin-top:14px;background:#fffdf7;border:1px solid #e3d6b8;border-radius:12px;padding:16px 16px 12px;box-shadow:0 2px 0 #e9dfc8}
.letter p{font-size:15px;line-height:1.9}
.letter .sg{text-align:right;font-family:var(--mark);color:#9a6f1f;font-size:24px;margin-top:6px}

/* 數字只是開始：動態限動圖 */
.cta{text-align:center}
.cta>p{font-size:14.5px;line-height:1.75;max-width:52ch;margin:0 auto}
.story{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;text-align:left}
.phone{position:relative;width:200px;aspect-ratio:9/16;border-radius:26px;padding:7px;background:linear-gradient(160deg,#4a2c52,#1c0f20);box-shadow:0 18px 40px rgba(45,25,50,.45),inset 0 0 0 1px rgba(234,192,99,.35)}
.phone canvas{display:block;width:100%;height:100%;border-radius:20px;background:#2d1932}
.phone::after{content:"";position:absolute;top:13px;left:50%;transform:translateX(-50%);width:54px;height:6px;border-radius:4px;background:rgba(0,0,0,.45)}
.sact{display:flex;flex-direction:column;gap:10px}
.sact h3{margin:0;font-size:17px}
.sact p{font-size:13.5px;color:var(--muted);line-height:1.6}
.prog{height:8px;border-radius:5px;background:#e8e0d3;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e2b04c,#f3d58a);transition:width .1s linear}
.sharetxt{width:100%;min-height:90px;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:8px}

/* 彩蛋與頁尾 */
.cheers{position:relative;align-self:center;background:none;border:0;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 16px;text-align:center;font-size:15px;line-height:1.5;letter-spacing:.06em}
.cheers .glasses{width:156px;height:auto;overflow:visible}
.cheers:not(.on) .glasses{animation:sway 4s ease-in-out infinite}
.gl{transform-box:fill-box;transform-origin:50% 100%}
.cheers.on .gl{animation:clink 1.1s cubic-bezier(.3,.7,.3,1)}
.spark{transform-box:fill-box;transform-origin:50% 50%;opacity:0}
.cheers.on .spark{animation:spark .9s .36s ease-out both}
.ding{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-family:var(--mark);font-size:26px;color:var(--gold);opacity:0;pointer-events:none}
.cheers.on .ding{animation:ding 1.1s .34s ease-out both}
.pt{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold);pointer-events:none}
.salt{position:absolute;width:4px;height:4px;border-radius:1px;background:#fbf7ef;box-shadow:0 0 3px rgba(255,255,255,.6);pointer-events:none}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes clink{0%{transform:none}35%{transform:translate(12px,-4px) rotate(14deg)}48%{transform:translate(8px,-2px) rotate(8deg)}60%{transform:translate(12px,-4px) rotate(13deg)}100%{transform:none}}
@keyframes spark{0%{opacity:0;transform:scale(.2)}30%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:scale(1.8) rotate(45deg)}}
@keyframes ding{0%{opacity:0;transform:translate(-50%,6px)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px)}}
.sign{display:flex;justify-content:center}
.sign svg{width:96px;height:auto;opacity:.9}
.sign path{fill:var(--gold)}
#ctext{display:block;min-height:3em}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(rgba(28,15,32,0),rgba(28,15,32,.96) 42%);padding-top:18px;padding-bottom:env(safe-area-inset-bottom)}
.dockin{max-width:520px;margin:0 auto;padding:6px 16px 12px}
.dockbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;border-radius:999px;background:linear-gradient(180deg,#f3d58a,#e2b04c);box-shadow:0 4px 0 #a87d2a,0 10px 24px rgba(0,0,0,.35);overflow:hidden}
.dbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;color:var(--plum);text-decoration:none;font-weight:900;font-size:16px;letter-spacing:.08em}
.dbtn svg{width:20px;height:20px;flex:none}
.dbtn:active{background:rgba(255,255,255,.25)}
.dsep{width:1px;margin:12px 0;background:rgba(45,25,50,.35)}
.dcap{text-align:center;font-size:11.5px;letter-spacing:.2em;color:var(--muted);margin-bottom:6px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade{animation:fadein .55s ease both;animation-delay:calc(var(--i,0)*90ms)}
#printarea{display:none}
@media print{
  @page{size:90mm 54mm;margin:0}
  html,body{background:#fff}
  body>*:not(#printarea){display:none!important}
  #printarea{display:block}
  #printarea img{display:block;width:90mm;height:54mm;page-break-after:always;break-after:page}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}#sky{display:none}.nine .lnk.draw{stroke-dashoffset:0}.nine .gp{opacity:1}}
@media (max-width:560px){
  h1{font-size:26px;letter-spacing:.14em}
  .panel{padding:42px 16px 20px}
  .facets,.missgrid,.two{grid-template-columns:1fr}
  .gridwrap{grid-template-columns:1fr}
  .nine{max-width:280px;margin:0 auto}
  .tbox{grid-template-columns:84px 1fr}.tcard{width:84px}
  .months{grid-template-columns:repeat(4,1fr)}
  .py{grid-template-columns:76px 1fr}.py .pn{width:76px;height:76px}.py .pn b{font-size:42px}
  .story{grid-template-columns:1fr;justify-items:center;text-align:center}
  .phone{width:min(230px,70vw)}
  .paid .chainbig{font-size:40px}
}

.tabnote{font-size:13.5px;color:var(--muted);line-height:1.65;text-align:center;margin:2px 0 12px}

.cs{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}

.cs.past b{border-color:color-mix(in srgb,var(--c) 50%,#fff);color:#5f4e64}

.cs.on small{color:var(--ink);font-weight:700}
.yj .yes{border-top:4px solid #3d8b57}.yj .no{border-top:4px solid var(--red)}

.yj .yes h4::before{content:"○";color:#3d8b57}.yj .no h4::before{content:"✕";color:var(--red)}

.months button::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}

.yiji{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:4px 14px 14px;font-size:14px}

.phead{display:flex;flex-direction:column;align-items:center;gap:4px}

.wn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--mark);font-size:24px;color:var(--fg);background:var(--c)}
.wk b{display:block;font-size:15.5px}.wk b small{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px}
.wk p{font-size:14px;line-height:1.65;margin-top:4px}
.wt{display:inline-block;font-size:11.5px;font-weight:900;color:#fff;background:var(--red);border-radius:5px;padding:0 6px;margin-right:6px}
.wt.ok{background:#3d8b57}
.wkall{padding:12px 14px;font-size:14px}

.roles{margin:0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:10px}
.roles li{counter-increment:r;position:relative;padding:10px 12px 10px 48px;border-radius:12px;background:#faf6ee;border:1px solid #ece2cf}
.roles li::before{content:counter(r);position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--plum);color:var(--gold);font-family:var(--mark);font-size:16px}
.roles b{display:block;font-size:15px}.roles p{font-size:13.5px!important;color:#5f4e64;line-height:1.6}
.moneyc{border-radius:18px;padding:16px;background:linear-gradient(160deg,#fff8e6,#fff);border:1.5px solid #ead29a;box-shadow:0 6px 16px rgba(201,154,46,.15)}
.moneyc>p{font-size:14.5px;line-height:1.8;margin-top:8px}
.mch{display:flex;align-items:center;gap:12px}
.coin{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:24px;color:#7a5413;background:radial-gradient(circle at 35% 30%,#fff3c4,#e2b04c 60%,#a87d2a);box-shadow:0 3px 8px rgba(168,125,42,.4),inset 0 0 0 3px rgba(255,255,255,.4)}
.mch .dvl{color:var(--gold2)}.mch b{display:block;font-size:18px}
.pals{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 6px}
.pal{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:999px;background:color-mix(in srgb,var(--c) 10%,#fff);border:1.5px solid color-mix(in srgb,var(--c) 45%,#fff);font-weight:700;font-size:14px}
.pal i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--mark);font-size:16px;background:var(--c);color:var(--fg)}
.pal.alt{border-style:dashed}

/* v7：職業精簡、盲點與業力卡 */
.roles{display:grid!important;grid-template-columns:1fr 1fr;gap:8px!important}
.roles li{padding:8px 10px 8px 38px!important;border-radius:10px}
.roles li::before{left:9px!important;top:9px!important;width:21px!important;height:21px!important;font-size:13px!important}
.roles b{font-size:14px!important;line-height:1.35}
.roles p{font-size:12px!important;line-height:1.5!important;margin-top:2px}
@media (max-width:380px){.roles{grid-template-columns:1fr}}
.trapc{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;margin-top:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#fff4ec,#fdeee8);border:1px solid #f0cfc0;position:relative;overflow:hidden}
.trapc::after{content:"";position:absolute;right:-18px;bottom:-18px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(184,69,47,.12),transparent 70%)}
.trapc .tri{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,#d4673f,#b8452f);box-shadow:0 4px 10px rgba(184,69,47,.3)}
.trapc .tri svg{width:22px;height:22px}
.trapc b{display:inline-block;font-size:12.5px;font-weight:900;letter-spacing:.14em;color:#b8452f;margin-bottom:2px}
.trapc p{font-size:14px!important;line-height:1.7;color:#4a2a26}
.karmac{position:relative;overflow:hidden;margin:12px 0 4px;padding:16px;border-radius:16px;color:#f0e6f3;background:radial-gradient(120% 140% at 100% 0%,#5b3a74 0%,#3a2150 45%,#24132f 100%);box-shadow:0 8px 20px rgba(45,25,50,.3),inset 0 0 0 1px rgba(234,192,99,.3)}
.karmac::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 70% 20%,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 85% 70%,rgba(234,192,99,.8),transparent),radial-gradient(1px 1px at 40% 80%,rgba(255,255,255,.5),transparent),radial-gradient(1px 1px at 60% 55%,rgba(255,255,255,.4),transparent);pointer-events:none}
.karmac>*{position:relative}
.kch{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.kwheel{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--gold);background:radial-gradient(circle,rgba(234,192,99,.22),rgba(234,192,99,.04));box-shadow:0 0 16px rgba(234,192,99,.35);animation:rays 24s linear infinite}
.kwheel svg{width:28px;height:28px}
.kch .dvl{color:#c9a7dc}
.kch b{display:block;font-size:18px;color:var(--gold);letter-spacing:.08em}
.karmac p{font-size:14px!important;line-height:1.85;color:#e8dcef!important}

/* v8：無障礙修正 */
.drink .dl0{color:#c4b4c8}
.mk b{color:#2d1932!important}
.price s{color:#6f6274}
.tlt{color:#86601a}
.mc .mt{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 88%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 78%,#000))!important}
.styles button,.yrs button,.pick select{min-height:44px}
.yj h3.h4,.two h3.h4{margin:0 0 4px;font-size:14.5px;display:flex;align-items:center;gap:6px}

[role=tabpanel]:focus{outline:none}
[role=tabpanel]:focus-visible{outline:2px solid var(--plum);outline-offset:4px;border-radius:12px}
@media (max-width:360px){.cycle2{gap:2px}.cs b{width:26px;height:26px;font-size:12px}.cs small{display:none}.cycle2::before{top:13px}}

/* v9：連線卡、淺色章節卡 */

.lnh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.lnd{display:inline-flex;align-items:center}

.lnh b{font-size:16px;font-weight:900;color:#2d1932}
.lnc p{font-size:13.5px;line-height:1.65;color:#3d2c42}
.lines{gap:10px}
.chap{background:#fff;color:var(--plum);border:1px solid var(--line);box-shadow:0 2px 8px rgba(45,25,50,.06)}

const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const now=new Date(),THIS_Y=now.getFullYear(),THIS_M=now.getMonth()+1;
const digits=n=>String(n).split('').map(Number);
const dsum=n=>digits(n).reduce((a,b)=>a+b,0);

/* ---------- 文案資料：主命數 1–9 ----------
   改字只要改這裡。drink：今晚適合你的一杯（品牌彩蛋）。 */
const N={
 1:{t:'開創者',en:'The Pioneer',kw:['獨立','行動力','有主見','勇敢'],
    lead:'你是天生的起跑者，腦中一有想法就想立刻動手。比起跟著別人走，你更喜歡自己開路，也常常是團體裡第一個說「我來」的人。',
    gift:'決斷快、不怕新環境，遇到卡關的局面，你往往是那個推一把的人。',
    task:'學著放慢一點聽聽別人的意見。獨立很好，但不代表什麼都要一個人扛。',
    love:'喜歡主動追求，也需要被欣賞。對方若太黏或太被動，你容易失去耐心。',
    work:'適合能自己作主的位置：創業、業務開發、專案負責人、自媒體。',
    drink:['龍舌蘭 Shot','加鹽加檸檬，一口見真章。乾脆俐落，就像你做決定的樣子。'],
    tarot:['I','魔術師','The Magician','手上的工具都備齊了，魔術師提醒你：想到就開始，你比自己以為的更有能力把想法變成真的。']},
 2:{t:'協調者',en:'The Peacemaker',kw:['敏感','體貼','合作','細膩'],
    lead:'你很會讀空氣，別人還沒開口，你就感覺到哪裡不對勁。你是團體裡的潤滑劑，讓大家相處起來比較舒服。',
    gift:'同理心強、細心、擅長合作與傾聽，是很棒的夥伴與支持者。',
    task:'別總是把自己的需要排在最後。說「不」不會讓你變壞人，而是讓關係更健康。',
    love:'重視陪伴與安全感，給得多也希望被在乎。容易想太多，需要對方明確的回應。',
    work:'適合需要溝通與細節的工作：助理、行政、諮詢、客服、設計協作。',
    drink:['貝禮詩奶酒','綿密溫柔、入口很甜，後勁卻很有存在感。'],
    tarot:['II','女祭司','The High Priestess','女祭司代表安靜的直覺。答案多半早就在你心裡，只是需要安靜下來聽。']},
 3:{t:'表達者',en:'The Communicator',kw:['樂觀','創意','表達','幽默'],
    lead:'你是派對裡的小太陽，話題多、點子多，很能把氣氛炒熱。你的感受很需要被說出來、寫出來或畫出來。',
    gift:'表達力與創造力強，擅長用文字、聲音、畫面打動人。',
    task:'興趣很多但容易三分鐘熱度，挑一兩件事好好做完，才會累積出真正的作品。',
    love:'喜歡有趣、聊得來的對象，討厭冷場。需要對方欣賞你的表達，也接得住你的情緒起伏。',
    work:'適合舞台型或創作型工作：行銷、社群、主持、教學、設計、寫作。',
    drink:['Mojito','清爽、有氣泡、薄荷味跳出來，一杯就讓人心情好。'],
    tarot:['III','皇后','The Empress','皇后是豐盛與創造。讓你的靈感長出來，你的熱情本身就很有感染力。']},
 4:{t:'實踐者',en:'The Builder',kw:['穩定','踏實','可靠','有規劃'],
    lead:'你是把事情做好的那個人。比起畫大餅，你更相信一步一步來，說到做到，是大家最放心的依靠。',
    gift:'有紀律、有耐心、重視細節，能把混亂整理成可行的計畫。',
    task:'別讓「安全感」變成框架。偶爾接受一點變動，世界不會因此垮掉。',
    love:'慢熱但專一，用行動表達愛。需要穩定、可預期的關係，討厭突如其來的變化。',
    work:'適合需要穩定與精準的工作：工程、財會、管理、建築、品管。',
    drink:['威士忌加冰','不花俏，一杯可以慢慢喝很久，越喝越有味道。'],
    tarot:['IV','皇帝','The Emperor','皇帝代表秩序與界線。你有能力建立自己的王國，前提是先把地基打穩。']},
 5:{t:'自由者',en:'The Adventurer',kw:['自由','好奇','變化','行動派'],
    lead:'你的人生關鍵字是「新鮮感」。新的地方、新的人、新的挑戰都讓你興奮，被綁住是你最怕的事。',
    gift:'適應力強、反應快、學習力好，總能在變動裡找到機會。',
    task:'自由不等於逃避。把熱情放在一件事上久一點，你會發現深度也很迷人。',
    love:'需要空間與新鮮感，喜歡能一起冒險的伴。對方管太多，你會想跑。',
    work:'適合有變化、能移動的工作：旅遊、業務、媒體、活動、自由接案。',
    drink:['長島冰茶','名字很無害，其實什麼都加了一點，跟你一樣充滿驚喜。'],
    tarot:['V','教皇','The Hierophant','教皇談的是傳承與信念。在一路嘗試之後，找到一套屬於自己、願意相信的原則。']},
 6:{t:'守護者',en:'The Nurturer',kw:['責任感','照顧','愛','美感'],
    lead:'你天生就會照顧人，朋友有事第一個想到你。你重視家人和關係，也對美有自己的品味。',
    gift:'溫暖、有責任感、願意付出，是讓人感到被愛的人。',

/* ---------- 計算 ---------- */
function calc(y,m,d){
  const all=digits(`${y}${String(m).padStart(2,'0')}${String(d).padStart(2,'0')}`);
  let s=all.reduce((a,b)=>a+b,0);
  const chain=[s];
  while(s>9){s=dsum(s);chain.push(s);}
  const masters=chain.filter(x=>x===11||x===22||x===33);
  const cnt=Array(10).fill(0);
  all.forEach(x=>cnt[x]++);
  // 九宮格：生日數字 + 計算過程中的每一個數字（兩位數拆開）
  chain.forEach((x,i)=>{ if(i<chain.length-1||chain.length===1) digits(x).forEach(v=>cnt[v]++); else cnt[x]++; });
  return {life:s,chain,masters,cnt};
}
const reduce9=n=>{while(n>9)n=dsum(n);return n;};

function readDate(yEl,mEl,dEl){
  const y=+yEl.value,m=+mEl.value,d=+dEl.value;
  if(!y||!m||!d) return {err:'請把年、月、日都填好。'};
  if(y<1920||y>THIS_Y) return {err:`出生年請填 1920 到 ${THIS_Y} 之間的西元年。`};
  if(d>new Date(y,m,0).getDate()) return {err:`${y} 年 ${m} 月沒有 ${d} 日，請再確認一次。`};
  return {y,m,d};
}

 '12':{n:'會說故事的人',core:'1 的主見加上 2 的細膩，落在 3 的表達。你有自己的觀點，又懂得照顧聽的人的感受，所以說出來的話特別有溫度，很容易讓人聽進去。',love:'喜歡能聊天聊到忘記時間的對象。冷戰是你最受不了的懲罰，有話直說反而讓你安心。',work:'行銷企劃、文案、主持、講師、Podcast，任何需要把想法說得動人的地方。',letter:'你的聲音值得被聽見。別因為怕被說話太多，就把重要的話吞回去。'},
 '13':{n:'慢慢築城的人',core:'13 是業力數之一。1 的衝勁遇上 3 的玩心，最後要回到 4 的踏實。你可能常覺得要比別人更努力才有成果，這正是你的功課：把才華收斂成紀律，城堡就會一塊磚一塊磚地蓋起來。',love:'外表看起來輕鬆隨性，其實很在意穩定。需要時間確認對方值得信任，一旦確定就很長情。',work:'設計、工程、手作、需要專業累積的職人工作。十年磨一劍最適合你。',letter:'慢不等於落後。你走的每一步都算數，回頭看，會發現自己已經蓋好一座城。'},
 '14':{n:'渴望自由的實踐派',core:'14 是業力數。1 的獨立加上 4 的規劃，最後走向 5 的自由。你常在「想安定」和「想出走」之間拉扯，人生功課是學會節制：真正的自由，要建立在對自己負責的基礎上。',love:'同時需要新鮮感和安全感。找一個能陪你冒險、也能陪你回家的人。',work:'業務、旅遊、活動企劃、跨領域接案。有規劃的變化最適合你。',letter:'你不是三心二意，你只是很想把人生活得很滿。記得替自己留一個可以回來的地方。'},
 '15':{n:'有個性的照顧者',core:'1 的自我加上 5 的自由，最後落在 6 的責任與愛。你很會照顧人，但用的是自己的方式，不喜歡被規定「應該怎麼愛」。',love:'深情又有原則。付出很多，也需要對方尊重你的個人空間。',work:'美業、餐飲、教育、空間設計，能把美感和照顧結合的工作。',letter:'你給出去的愛都很真。偶爾也讓別人用他們的方式照顧你吧。'},
 '16':{n:'看透真相的孤獨探索者',core:'16 是業力數。1 的自我加上 6 的愛，最後走進 7 的內省。人生常出現「原本以為很穩，卻突然被打碎」的時刻，很像塔羅的高塔。每一次崩塌都在逼你放下小我，找到更真實的信念。',love:'對愛的標準很高，怕受傷所以會先觀察很久。一旦交心就非常專一，也需要對方的真誠。',work:'研究、分析、心理、命理、寫作，需要深度與獨立思考的領域。',letter:'被打碎過的人，才看得見光從哪裡照進來。你的孤獨不是懲罰，是你聽見內在聲音的地方。'},
 '17':{n:'有遠見的領航者',core:'1 的開創加上 7 的洞察，落在 8 的成就。你不只敢衝，還會先想清楚再衝，所以常常成為做決策的那個人。',love:'欣賞聰明、有想法的伴侶。表達愛的方式，是幫對方一起規劃未來。',work:'管理、投資、顧問、創業，策略和執行都要的位置。',letter:'你的野心很美，因為它有思考撐著。登頂的路上，也記得讓重要的人跟上。'},
 '18':{n:'有行動力的理想家',core:'1 的勇氣加上 8 的能力，最後落在 9 的大愛。你想讓世界更好，而且真的有本事動手去做。',love:'付出大方，常成為對方的依靠。要小心把伴侶當成需要拯救的人。',work:'社會企業、公益組織、醫療、教育管理，把影響力用在你在乎的事情上。',letter:'世界因為有你這樣的人而好一點。別忘了你自己，也是需要好好照顧的那個人。'},
 '19':{n:'歷經磨練的王者',core:'19 是業力數。1 和 9 是數字的頭與尾，繞了一圈又回到 1。你的人生功課是學會「獨立但不孤立」：靠自己站起來，也願意接受別人的幫助。',love:'自尊心強，不輕易示弱。遇到真心接住你的人，會讓你非常感動。',work:'創業、領導職、自由業。經歷的挑戰越多，越能撐起一片天。',letter:'你已經很會一個人走了。下一關是：讓別人陪你走一段，也不會讓你變弱。'},
 '20':{n:'溫柔的放大器',core:'2 加上 0，你的敏感與同理心被放大了。房間裡每個人的情緒你都感受得到，是天生的和事佬。',love:'渴望穩定、親密的關係。給得很多，也需要對方常常說愛你。',work:'人資、客服、社工、助理、護理，讓人覺得被照顧的位置。',letter:'你感受得到大家，也請記得感受自己。你的需要跟別人的一樣重要。'},
 '21':{n:'靈活的社交家',core:'2 的體貼加上 1 的主見，落在 3 的表達。你很會在團體裡找到自己的位置，既能帶話題，也懂得接話。',love:'喜歡有互動感的戀愛，需要對方欣賞你的幽默與點子。',work:'公關、社群經營、業務、活動主持。人越多，你越亮。',letter:'你讓身邊的人都笑了。偶爾也允許自己不那麼開心，真實的你一樣受歡迎。'},
 '22':{n:'把夢想蓋成大樓的人',core:'卓越數 22 被稱為「建築大師數」，兩個 2 疊起來落在 4。你擁有把大格局落地的能力，但也容易被自己的高標準壓得喘不過氣。',love:'重承諾，一旦決定就想走很久。需要一個願意跟你一起規劃未來的伴。',work:'建築、工程、大型專案管理、制度設計、創業。',letter:'你的夢很大，你的肩膀也夠寬。不必一次扛完，大樓也是一層一層蓋起來的。'},
 '23':{n:'到處交朋友的旅人',core:'2 的人緣加上 3 的表達，走向 5 的自由。你好奇、好聊、反應快，到了新環境很快就如魚得水。',love:'喜歡有趣、會帶你去新地方的人，最討厭一成不變。',work:'媒體、旅遊、業務、自由接案、翻譯。',letter:'世界很大，你都想去看看。記得把沿路的好故事，也帶回來分享給在乎你的人。'},
 '24':{n:'顧家的溫暖港灣',core:'2 的體貼加上 4 的穩定，落在 6 的愛。你是很典型的照顧者，可靠又細心，家人朋友都很依賴你。',love:'適合長期穩定的關係，會把對方的生活打理得很好。',work:'教育、醫護、行政、餐飲、居家相關產業。',letter:'你是很多人的港灣。累的時候也可以靠岸休息，不用一直當燈塔。'},
 '25':{n:'直覺很準的觀察者',core:'2 的敏感加上 5 的好奇，走進 7 的思考。你很會觀察人，常常一眼就看出問題在哪，只是不一定說出口。',love:'需要時間打開心房。喜歡能深聊、也尊重你獨處時間的人。',work:'研究、調查、心理、數據分析、命理占卜。',letter:'你看得很清楚，也請相信你看見的。說出來，可能剛好就是別人需要的答案。'},
 '26':{n:'懂人心的經營者',core:'2 的同理加上 6 的責任，落在 8 的成就。你的力量來自「懂人」：知道每個人需要什麼，所以很會帶團隊。',love:'會替對方著想，也希望兩個人有共同的目標。',work:'管理、人資主管、服務業經營、家族事業。',letter:'你帶人用的是心，所以大家願意跟著你。記得，你也可以被照顧。'},
 '27':{n:'溫柔的智者',core:'2 的感受力加上 7 的智慧，落在 9 的包容。你是朋友眼中的人生導師，很會聽，也常說出讓人豁然開朗的話。',love:'浪漫、重視心靈交流，容易對受過傷的人心軟。',work:'諮商、教學、療癒、寫作、身心靈。',letter:'你懂很多人的痛，也請溫柔對待自己的。你的智慧，先拿來照亮自己。'},
 '28':{n:'溫和但堅定的領導者',core:'2 的協調加上 8 的能力，繞回 1 的獨立。你不是靠強勢帶人，而是讓人信服，屬於「默默把事情做到最好」的類型。',love:'想要平等的伴侶關係。討厭被控制，也不喜歡控制別人。',work:'主管、創業、專案經理、自營品牌。',letter:'你的溫柔就是你的力量。不用變得強硬，大家也會看見你。'},
 '29':{n:'敏銳的靈魂療癒者',core:'2 和 9 都帶著很深的感受力，加總出現卓越數 11，最後落在 2。你的直覺和同理心都很強，容易被別人的情緒影響，也很能療癒人。',love:'渴望靈魂伴侶，容易全心投入，也容易受傷。',work:'療癒、藝術、諮商、占卜、社福。',letter:'你接住了很多人，你也值得被接住。學會說「我今天不行」，是愛自己的開始。'},
 '30':{n:'天生的表演者',core:'3 加上 0，表達力和創意被放大。你有舞台魅力，情緒豐富，很能感染別人。',love:'喜歡轟轟烈烈的愛，需要被欣賞，冷淡會讓你枯萎。',work:'表演、設計、內容創作、主持、藝術。',letter:'你的光不需要誰同意才能亮。也記得，不在舞台上的你，一樣值得被愛。'},
 '31':{n:'有創意的實踐家',core:'3 的創意加上 1 的行動，落在 4 的穩定。你有點子也有執行力，是能把想法做成產品的人。',love:'外表活潑，內心想要穩定、可靠的關係。',work:'產品設計、工程、品牌經營、手作職人。',letter:'你能把天馬行空變成真的，這很難得。給自己多一點耐心，作品需要時間長大。'},
 '32':{n:'說走就走的開心果',core:'3 的樂觀加上 2 的人緣，走向 5 的自由。你走到哪都交得到朋友，喜歡變化，也很能適應。',love:'需要有趣、能一起玩的伴侶，太黏會讓你想逃。',work:'旅遊、媒體、業務、活動、外語相關。',letter:'你的快樂很有感染力。偶爾停下來，問問自己真正想留下來的地方是哪裡。'},
 '33':{n:'無私的大愛導師',core:'卓越數 33 被稱為「大師導師數」，兩個 3 疊起來落在 6。你有很強的奉獻與療癒能量，總是先想到別人。',love:'愛得很深，也容易付出過頭，需要練習「被愛」。',work:'教育、醫護、宗教、療癒、公益。',letter:'你給了這個世界很多愛。這一次，留一份給自己，不用感到抱歉。'},
 '34':{n:'有想法的分析師',core:'3 的創意加上 4 的邏輯，走進 7 的思考。你點子多又有條理，擅長把複雜的事情講清楚。',love:'需要聊得來的伴侶，欣賞聰明與幽默。',work:'研究、企劃、寫作、軟體、教學。',letter:'你想得很深，也說得很好。別讓完美主義擋住你分享的機會。'},
 '35':{n:'靈活的商業頭腦',core:'3 的表達加上 5 的靈活，落在 8 的成就。你很會抓機會、也很會推銷，對賺錢的嗅覺特別敏銳。',love:'喜歡有活力、有目標的伴侶，一起打拚最有感。',work:'業務、行銷、創業、電商、經紀。',letter:'你很會把握機會。也記得，最好的投資，是陪你一起打拚的人。'},
 '36':{n:'藝術家靈魂',core:'3 的創意加上 6 的美感，落在 9 的理想。你對美和意義都有追求，作品裡常帶著溫柔的關懷。',love:'浪漫、重感覺，容易愛上有故事的人。',work:'藝術、設計、音樂、公益、教育。',letter:'你讓世界變美了一點。不必等到完美，才把作品拿出來。'},
 '37':{n:'聰明的獨行者',core:'3 的表達加上 7 的智慧，繞回 1 的獨立。你有自己一套想法，不太需要別人認同，也很會說服人。',love:'需要空間，欣賞獨立、有自己生活的伴侶。',work:'顧問、講師、作家、自媒體、創業。',letter:'你知道自己是誰，這很珍貴。偶爾讓別人走進來，你的世界會更大。'},
 '38':{n:'有靈感的協調者',core:'3 的創意和 8 的執行，加總出現卓越數 11，最後落在 2。你很有靈感也很懂人，在合作裡最能發揮。',love:'敏感細膩，需要被理解，也很會照顧對方。',work:'設計、品牌顧問、諮詢、團隊協調。',letter:'你的靈感加上你的溫柔，是很強的組合。相信自己的感覺。'},
 '39':{n:'感性的創作者',core:'3 和 9 都是感性的數字，經過 12 落在 3。你的情感很豐沛，很適合把感受化成文字、畫面或聲音。',love:'浪漫，情緒起伏大，需要能包容你的人。',work:'藝術、寫作、音樂、設計、教學。',letter:'你的感受是你的寶藏。把它畫出來、寫出來，就不會只是壓在心裡。'},
 '40':{n:'超級可靠的基石',core:'4 加上 0，穩定與紀律被放大。你非常可靠、說到做到，是團隊裡最讓人安心的存在。',love:'慢熱、務實，用行動照顧對方。',work:'工程、財會、法律、公職、品管。',letter:'大家都靠著你。也記得偶爾放鬆一下，世界不會因此塌下來。'},
 '41':{n:'有規劃的冒險家',core:'4 的穩定加上 1 的開創，走向 5 的自由。你想要變化，但會先做好準備，是很有策略的冒險家。',love:'需要自由也需要安全感，喜歡能陪你一起規劃旅程的人。',work:'創業、專案管理、業務、物流、旅遊規劃。',letter:'你既敢走又會想，這就是最好的冒險。'},
 '42':{n:'默默守護的人',core:'4 的可靠加上 2 的體貼，落在 6 的愛與責任。你是那種不多說、但一直都在的人。',love:'專一、顧家，重視長久的關係。',work:'醫護、教育、行政、社福、家業。',letter:'你的守護大家都看在眼裡。說出你的需要，也是一種愛。'},
 '43':{n:'務實的研究者',core:'4 的嚴謹加上 3 的創意，走進 7 的思考。你做事認真又有想法，很適合深耕一門專業。',love:'慢熱、重視信任，喜歡能一起成長的伴侶。',work:'科研、工程、醫學、分析、技術專家。',letter:'你的專注很迷人。別忘了抬頭看看身邊，有人一直在等你分享。'},
 '44':{n:'意志堅強的實業家',core:'兩個 4 的穩健落在 8 的成就。你非常能吃苦、目標感強，是會把事情做大、做穩的人。',love:'務實，給對方滿滿的安全感，但要記得把感情說出口。',work:'企業管理、不動產、金融、製造業。',letter:'你一步一步走出了自己的版圖。成功之外，也替生活留點溫度。'},
 '45':{n:'腳踏實地的理想家',core:'4 的實際加上 5 的靈活，落在 9 的理想。你有理想也有方法，能把善意變成真正的行動。',love:'包容、成熟，願意為關係付出。',work:'公益、教育、醫療、社會企業、國際事務。',letter:'你讓理想不只是說說而已。請也把這份實踐，用在照顧自己身上。'},
 '46':{n:'穩重的開創者',core:'4 的穩定加上 6 的責任，繞回 1 的開創。你開路時會顧及身邊的人，是很負責任的領導者。',love:'重承諾，會為家人努力打拚。',work:'創業、管理、家族企業、教育經營。',letter:'你走在前面，也照顧著後面的人。偶爾回頭，讓別人也照顧你。'},
 '47':{n:'直覺型的實踐者',core:'4 的踏實加上 7 的直覺，加總出現卓越數 11，最後落在 2。你很少見地同時擁有理性與靈性。',love:'細膩又務實，需要有深度的交流。',work:'醫療、心理、研究、命理、顧問。',letter:'你的直覺有根有據，好好相信它。'},
 '48':{n:'有底氣的表達者',core:'4 與 8 帶來穩定和實力，經過 12 落在 3 的表達。你說的話有份量，因為背後有實力撐著。',love:'成熟可靠，也很會逗對方開心。',work:'講師、管理、品牌經營、媒體。',letter:'你有底氣，也有溫度。放心地說，你的聲音值得被聽見。'},
 's4':{n:'純粹的 4・穩穩的地基',core:'你的生日數字加總直接就是 4，沒有經過兩位數，能量非常純粹：踏實、可靠、一步一腳印。2000 年後出生才會出現這種組合，你是新世代裡難得的定心丸。',love:'慢熱但專一，喜歡細水長流的關係。',work:'工程、會計、資訊、需要精準與耐心的工作。',letter:'你的穩定是一種天賦。也允許自己偶爾亂一下，生活會更有趣。'},
 's5':{n:'純粹的 5・自由的風',core:'生日數字加總直接是 5，自由與好奇的能量很純粹。你很能適應變化，學新東西特別快。',love:'需要空間與新鮮感，喜歡能一起探索世界的伴。',work:'媒體、旅遊、社群、自由接案。',letter:'你是風，不需要被關住。只要記得，風也有想停下來的地方。'},
 's6':{n:'純粹的 6・溫暖的家',core:'生日數字加總直接是 6，愛與責任的能量很純粹。你天生會照顧人，也很重視家人與朋友。',love:'深情、顧家，重視承諾。',work:'教育、醫護、餐飲、美業、設計。',letter:'你讓身邊的人覺得有家的感覺。你也值得被這樣對待。'},
 's7':{n:'純粹的 7・安靜的燈',core:'生日數字加總直接是 7，思考與直覺的能量很純粹。你喜歡想事情的本質，需要安靜的時間。',love:'慢熟，需要信任感與心靈交流。',work:'研究、資訊、心理、寫作。',letter:'你的安靜裡有很多光。願意的時候，讓別人看見它。'},
 's8':{n:'純粹的 8・天生的實力派',core:'生日數字加總直接是 8，企圖心與執行力的能量很純粹。你目標明確，很早就知道自己想要什麼。',love:'可靠、想給對方最好的，也需要被尊重。',work:'管理、金融、創業、業務。',letter:'你會走得很遠。記得在路上，也照顧好自己的心。'},
 's9':{n:'純粹的 9・溫柔的老靈魂',core:'生日數字加總直接是 9，包容與理想的能量很純粹。你年紀輕輕就很懂事，常被說是老靈魂。',love:'浪漫、包容，要分清楚愛與同情。',work:'藝術、教育、公益、療癒。',letter:'你懂得很多，也別忘了，你還可以任性一點。'}
};

/* ---------- 給你的一封信（付費解析最後一頁）。一段一個字串。 ---------- */
const LETTERS={
 '10':['你總是那個先往前走的人。別人還在猶豫，你已經把第一步踩出去了，這份勇氣很珍貴，也常常讓你一個人走在最前面，有點冷。','我想跟你說，你不必每次都當第一個，但你可以每次都當最真實的那個。累的時候停下來，不代表你輸了；歸零也不是失敗，是你重新選擇的權利。','下一次重新出發之前，記得回頭看看，那些一路陪你的人還在。敬勇敢的你一杯，也敬願意休息的你。'],
 '11':['你的心像一根很靈敏的天線，別人一個眼神、一句沒說完的話，你都接收得到。這讓你很懂人，也讓你常常比別人更累。','敏感不是你的弱點，而是你接收世界的方式。只是天線開太久會過熱，記得替自己留一段「關機時間」：不回訊息、不讀空氣，只聽自己的聲音。','你的直覺很少騙你。下次心裡有個小聲音在說話，先相信它一次。敬這樣柔軟又強大的你。'],
 '12':['你說話的時候，會不自覺照顧聽的人的感受，所以你的話總是特別有溫度。很多人因為你的一句話，突然覺得被理解了。','但我也知道，你常常在說出口前先想很多遍：會不會太多？會不會讓人不舒服？最後乾脆吞回去。那些被吞掉的話，其實也很重要。','你的聲音值得被聽見。從今天開始，試著每天說一句真心話，給別人，也給自己。我會在這裡聽。'],
 '13':['你可能常覺得，自己要比別人更努力，才能得到一樣的成果。這不是你不夠好，而是你的人生功課本來就是「把才華磨成手藝」。','13 是需要耐心的數字。玩心很重要，它讓你有創意；紀律也很重要，它讓創意變成作品。你不需要二選一，只需要每天多堅持一點點。','慢不等於落後。你走的每一步都算數，回頭看，會發現自己已經蓋好一座城。敬每一塊你親手放上去的磚。'],
 '14':['你心裡住著兩個人：一個想安定下來，一個想立刻出走。他們常常吵架，吵到你自己也不知道到底想要什麼。','其實你不是三心二意，你只是很想把人生活得很滿。14 的功課是節制，不是要你放棄自由，而是學會在出發前，先替自己準備好回家的路。','去看世界吧，也替自己留一個可以回來的地方。那裡會有人等你，也會有一杯酒等你。'],
 '15':['你很會照顧人，但你用的是自己的方式，不喜歡被規定「應該怎麼愛」。這份有個性的溫柔，是你最迷人的地方。','只是照顧別人久了，你可能忘了自己也需要被照顧。當有人想對你好的時候，試著不要急著拒絕或回禮，先收下就好。','你給出去的愛都很真。這一次，讓別人用他們的方式愛你吧。敬自由又溫暖的你。'],
 '16':['你的人生裡，常有「原本以為很穩，卻突然被打碎」的時刻。一段關係、一個計畫、一個你很相信的人。那種感覺很痛，我知道。','但被打碎過的人，才看得見光從哪裡照進來。每一次崩塌，都在幫你拿掉不屬於你的東西，留下的那個你，越來越真實、越來越堅定。','你的孤獨不是懲罰，是你聽見內在聲音的地方。不用急著讓所有人理解你，先理解自己就夠了。今晚，敬重新長出來的你。'],
 '17':['你不只敢衝，還會先想清楚再衝。所以很多時候，大家會把方向盤交給你，因為跟著你走比較安心。','這份野心很美，因為它有思考撐著。只是當你一直看著遠方，可能會忘了身邊的人跟不跟得上，也忘了自己其實也會累。','登頂的路上，記得偶爾停下來，等等重要的人，也看看沿路的風景。敬看得遠、也願意慢下來的你。'],
 '18':['你想讓這個世界好一點，而且你真的有本事動手去做。這種人不多，你是其中一個。','只是你常常把別人的問題扛在自己肩上，好像不解決就是你的錯。記得：幫忙是你的選擇，不是你的責任。你不需要拯救每一個人。','世界因為有你這樣的人而好一點。別忘了，你自己也是需要好好被照顧的那個人。敬溫柔又有力量的你。'],
 '19':['你經歷過很多需要一個人撐過去的時刻，所以你很會靠自己，也不太習慣開口求救。','19 的功課是「獨立但不孤立」。你已經證明了自己可以一個人走，下一關是：讓別人陪你走一段，也不會讓你變弱。接受幫助，其實需要更大的勇氣。','下次覺得累，試著傳一則訊息給在乎你的人，只說一句「我今天有點累」。敬一路走來的你。'],
 '20':['你總是第一個感覺到房間裡的氣氛變了，也總是第一個想辦法讓大家舒服一點。你是很多人心裡的避風港。','只是你感受得到大家，卻常常忘了感受自己。你的難過、你的不想、你的需要，跟別人的一樣重要。','今天就好，替自己做一件不需要考慮別人的事。敬溫柔的你，也敬開始學會說「不」的你。'],
 '21':['你很會在團體裡找到自己的位置，能帶話題，也懂得接話。有你在的地方，氣氛就是比較好。','但我想偷偷問你：熱鬧散場之後，你是不是常常覺得有點空？你不必一直當那個讓大家笑的人。','真實的你，不開心的你，安靜的你，一樣受歡迎。敬總是帶給別人快樂的你，這杯換我陪你。'],
 '22':['你的夢很大，大到有時候連自己都覺得害怕。22 給了你把大格局落地的能力，也給了你很高的標準。','高標準讓你走得很遠，也讓你常常覺得自己還不夠好。可是你已經比你以為的做到更多了。','不必一次扛完，大樓也是一層一層蓋起來的。今天完成一小塊就很好。敬正在蓋夢想的你。'],
 '23':['你好奇、好聊、反應快，到哪裡都交得到朋友，世界在你眼中就是一個很大的遊樂園。','只是一直在路上的人，偶爾也會想停下來。如果哪天你發現自己有點累，那不是你變無聊了，是你在找一個可以放心停靠的地方。','把沿路的好故事帶回來，分享給在乎你的人。敬自由的你，也敬願意回家的你。'],
 '24':['你是很多人的港灣，可靠又細心，家人朋友有事第一個想到你。你一直都在，這件事本身就很了不起。','但港灣也需要休息。你不用一直當燈塔，偶爾關掉燈、讓別人來照顧你，世界不會因此塌下來。','今天試著讓自己被照顧一次，哪怕只是讓別人請你喝一杯。敬一直守護大家的你。'],
 '25':['你很會觀察人，常常一眼就看出問題在哪裡，只是你不一定會說出口，怕說了會讓人不舒服。','你看得很清楚，也請相信你看見的。你的觀察不是多疑，而是一種天賦。說出來，可能剛好就是別人需要的答案。','下次心裡有答案的時候，溫柔地說出來試試看。敬看得透、也願意說的你。'],
 '26':['你的力量來自「懂人」。你知道每個人需要什麼，所以很會帶人，大家也願意跟著你。','只是你一直在照顧團隊、照顧家人，很少有人問你：你需要什麼？你也可以被照顧，這不會讓你變得不可靠。','帶人用的是心，也記得把一點心留給自己。敬溫柔又有擔當的你。'],
 '27':['你是朋友眼中的人生導師，很會聽，也常說出讓人豁然開朗的話。很多人在最低潮的時候，會想到你。','但懂很多人的痛的人，自己的痛往往最少被看見。你也可以累、可以不想當智者、可以只是一個需要被抱一下的人。','你的智慧，先拿來照亮自己。今晚，換我敬你一杯，謝謝你一直是別人的光。'],
 '28':['你不是靠強勢帶人，而是靠讓人信服。你總是默默把事情做到最好，不太邀功，也不太抱怨。','我想提醒你，溫柔不是軟弱，你的溫柔就是你的力量。不用變得強硬，大家也看得見你。','記得替自己爭取應得的，那不是自私，是對自己的尊重。敬溫和又堅定的你。'],
 '29':['你的直覺和同理心都很強，常常一走進房間就知道誰在難過。你接住了很多人，也常常因此被掏空。','29 帶著卓越數 11 的能量，你天生有療癒別人的力量，但療癒師也需要被療癒。學會說「我今天不行」，是愛自己的開始。','你接住了很多人，你也值得被接住。今晚把天線關掉，好好睡一覺。敬敏銳又溫柔的你。'],
 '30':['你有舞台魅力，情緒豐富，很能感染別人。你一出現，空氣就亮起來了。','只是站在聚光燈下的人，偶爾會怕燈熄了就沒人看見自己。你的光不需要誰同意才能亮。','不在舞台上的你、安靜的你、狼狽的你，一樣值得被愛。敬閃閃發亮的你，也敬卸妝後的你。'],
 '31':['你有點子也有執行力，是少數能把天馬行空變成真東西的人。這很難得。','只是你對自己的作品很嚴格，常常覺得還不夠好、還不能拿出來。作品需要時間長大，你也是。','給自己多一點耐心，先完成，再完美。敬正在創造的你。'],
 '32':['你走到哪裡都交得到朋友，喜歡變化，也很能適應。你的快樂很有感染力。','只是一直在移動的人，有時候會分不清楚自己是在探索，還是在逃避。偶爾停下來問問自己：我真正想留下來的地方是哪裡？','不用急著回答，答案會在路上慢慢出現。敬開心果一樣的你。'],
 '33':['你有很強的奉獻與療癒能量，總是先想到別人。很多人因為你，覺得這個世界還是溫暖的。','但你給了這個世界很多愛，給自己的卻很少。33 的功課，是學會被愛：接受讚美、接受幫忙，不用急著回報。','這一次，把一份愛留給自己，不用感到抱歉。敬像太陽一樣的你。'],
 '34':['你點子多又有條理，很會把複雜的事情講清楚。和你聊天，總能學到新東西。','只是你常常想等到完美才分享，結果很多好想法就放在心裡過期了。完美主義保護了你，也擋住了你。','先分享七十分的版本吧，世界需要你的想法。敬想得深、也說得好的你。'],
 '35':['你很會抓機會，也很會推銷，對賺錢的嗅覺特別敏銳。你知道自己想要什麼，這讓你走得很快。','衝刺的時候，記得看看身邊陪你打拚的人。成功很好，但有人一起慶祝會更好。','最好的投資，是那些在你還沒成功時就相信你的人。敬靈活又有眼光的你。'],
 '36':['你對美和意義都有追求，作品裡總帶著溫柔的關懷。你讓世界變美了一點。','只是你常常等「準備好」才行動，等靈感、等完美、等對的時機。其實沒有人會真的準備好。','不必等到完美，才把作品拿出來。你的不完美，也是一種美。敬藝術家靈魂的你。'],
 '37':['你有自己一套想法，不太需要別人認同，也很會說服人。你知道自己是誰，這很珍貴。','只是太獨立的人，偶爾會忘了人和人之間的溫度。讓別人走進來，不代表你失去了自己。','偶爾打開門，你的世界會更大。敬聰明又獨特的你。'],
 '38':['你很有靈感，也很懂人，在合作裡最能發揮。你常常是團隊裡那個把大家串起來的人。','38 帶著卓越數 11 的能量，你的直覺比你以為的還準。只是你常常為了和諧，把自己的想法放到最後。','你的靈感加上你的溫柔，是很強的組合。相信自己的感覺，大膽說出來。敬敏銳又溫暖的你。'],
 '39':['你的情感很豐沛，常常一首歌、一句話就讓你紅了眼眶。這不是脆弱，是你感受世界的能力比別人強。','只是情緒太滿的時候，你可能會被淹沒。把它畫出來、寫出來、唱出來，就不會只是壓在心裡。','你的感受是你的寶藏，好好收藏它。敬感性又勇敢的你。'],
 '40':['你非常可靠、說到做到，是團隊裡最讓人安心的存在。大家都靠著你。','但一直撐著的人，最容易忘記自己也會累。你不需要永遠都是那個不會倒的人。','偶爾放鬆一下，世界不會塌下來。讓別人也有機會照顧你。敬穩穩的你。'],
 '41':['你想要變化，但會先做好準備，是很有策略的冒險家。你知道什麼時候該衝、什麼時候該等。','只是計畫太周全的時候，也可能錯過一些意外的美好。偶爾留一點空白給未知吧。','你既敢走又會想，這就是最好的冒險。敬有地圖、也有勇氣的你。'],
 '42':['你是那種不多說、但一直都在的人。家人朋友有事，你總是默默出現。','只是默默的人，需要常常被提醒：你的感受也很重要。說出你的需要，不會讓你變成麻煩，反而會讓關係更近。','你的守護大家都看在眼裡。今天，換別人守護你一次吧。敬溫柔又可靠的你。'],
 '43':['你做事認真又有想法，很適合把一件事做到很深、很好。你的專注很迷人。','只是當你埋頭鑽研的時候，可能會忘了抬頭看看身邊。有人一直在等你分享，等你一起吃頓飯。','專業很重要，生活也很重要。敬認真又可愛的你。'],
 '44':['你非常能吃苦、目標感很強，一步一步走出了自己的版圖。很多人羨慕你的成就，卻沒看見你付出了多少。','成功之外，也替生活留點溫度。你的家人、朋友、伴侶，比任何成績都更值得你花時間。','把感情說出口吧，他們會很開心。敬意志堅強的你。'],
 '45':['你有理想也有方法，能把善意變成真正的行動。你讓理想不只是說說而已。','只是你常常把資源給了別人，留給自己的卻很少。照顧世界之前，先照顧好自己，你才能走得更遠。','請也把這份實踐，用在照顧自己身上。敬腳踏實地又溫柔的你。'],
 '46':['你走在前面開路，也照顧著後面的人。你是負責任的領導者，也是大家心裡的大樹。','只是大樹也需要雨水。偶爾回頭，讓別人也照顧你，不會讓你變得不夠強。','你已經為很多人撐起一片天了。今晚，替自己撐一次傘。敬穩重又溫暖的你。'],
 '47':['你很少見地同時擁有理性與靈性，能用邏輯分析，也能用直覺感受。','47 帶著卓越數 11 的能量，你的直覺有根有據。只是你常常太講道理，反而不敢相信自己的感覺。','下一次，讓直覺先說話，再讓理性幫它把關。敬聰明又通透的你。'],
 '48':['你說的話有份量，因為背後有實力撐著。大家喜歡聽你說話，也願意相信你。','只是有底氣的人，偶爾會忘了示弱也是一種力量。讓別人看見你的柔軟，你會更有魅力。','放心地說吧，你的聲音值得被聽見。敬有底氣、也有溫度的你。'],

function chips(x,items,X,Y,maxW,maxY,opt){
  for(let fs=opt.fs;fs>=16;fs-=2){
    const h=fs*1.75,gap=10,pos=[];let cx=X,cy=Y,ok=true;
    x.font=`${opt.weight||700} ${fs}px ${SANS}`;
    for(const it of items){
      const tw=x.measureText(it.t).width+(it.dot?fs*1.1:0)+fs*1.1;
      if(cx+tw>X+maxW&&cx>X){cx=X;cy+=h+gap;}
      pos.push([cx,cy,tw,it]);cx+=tw+gap;
    }
    if(cy+h>maxY&&fs>16){ok=false;}
    if(ok||fs<=16){
      for(const [px,py,tw,it] of pos){
        rr(x,px,py,tw,h,h/2);x.fillStyle=it.bg||opt.bg;x.fill();
        if(opt.stroke){x.strokeStyle=opt.stroke;x.lineWidth=2;x.stroke();}
        let tx=px+fs*.55;
        if(it.dot){x.beginPath();x.arc(tx+fs*.38,py+h/2,fs*.38,0,7);x.fillStyle=it.dot;x.fill();x.strokeStyle='rgba(45,25,50,.25)';x.lineWidth=1.5;x.stroke();tx+=fs*1.1;}
        x.fillStyle=it.fg||opt.fg;x.textBaseline='middle';x.textAlign='left';x.fillText(it.t,tx,py+h/2+1);
      }
      x.textBaseline='alphabetic';return cy+h;
    }
  }
}

function nineGrid(x,X,Y,size,cnt,got){

  }catch(e){}
}

/* PDF：自己組，不用外部套件。每張卡以 JPEG 嵌入 */
function jpgBytes(c){const b=atob(c.toDataURL('image/jpeg',.95).split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function buildPDF(imgs,pages){
  const te=new TextEncoder(),parts=[],offs=[];let len=0;
  const put=p=>{const u=typeof p==='string'?te.encode(p):p;parts.push(u);len+=u.length;};
  const obj=(n,body,stream)=>{offs[n]=len;put(`${n} 0 obj\n`);put(body);if(stream){put('\nstream\n');put(stream);put('\nendstream');}put('\nendobj\n');};
  put('%PDF-1.4\n');put(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  const nI=imgs.length,pageNo=i=>3+nI+i*2;
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Kids [${pages.map((_,i)=>pageNo(i)+' 0 R').join(' ')}] /Count ${pages.length} >>`);
  imgs.forEach((u,i)=>obj(3+i,`<< /Type /XObject /Subtype /Image /Width ${CW} /Height ${CH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${u.length} >>`,u));
  pages.forEach((p,i)=>{
    const xo=imgs.map((_,k)=>`/Im${k} ${3+k} 0 R`).join(' '),cs=te.encode(p.ops);
    obj(pageNo(i),`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${p.w.toFixed(3)} ${p.h.toFixed(3)}] /Resources << /XObject << ${xo} >> >> /Contents ${pageNo(i)+1} 0 R >>`);
    obj(pageNo(i)+1,`<< /Length ${cs.length} >>`,cs);
  });
  const N2=3+nI+pages.length*2,xs=len;
  put(`xref\n0 ${N2}\n0000000000 65535 f \n`+Array.from({length:N2-1},(_,i)=>String(offs[i+1]).padStart(10,'0')+' 00000 n \n').join(''));
  put(`trailer\n<< /Size ${N2} /Root 1 0 R >>\nstartxref\n${xs}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}

function heroHTML(){

    <div class="kw">${n.kw.map(k=>`<span>${k}</span>`).join('')}</div>
    <p class="lead">${n.lead}</p>
    ${msTxt}
    <div class="facets">
      ${fc('gift','天賦','TALENT',n.gift)}
      ${fc('task','人生課題','LIFE LESSON',n.task)}
      ${fc('love','愛情裡的你','LOVE',n.love)}
      ${fc('work','工作與金錢','CAREER & MONEY',n.work)}

function storyGrid(x,X,Y,size,p){

let storyRAF=0,storyVis=false,storyIO=null;
async function startStory(){

function pickMime(){

  for(const m of ['video/mp4;codecs=avc1.42E01F','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']) if(MediaRecorder.isTypeSupported(m)) return m;
  return null;
}

  if(!mime||!c.captureStream){m.className='dlmsg no';m.textContent='這個瀏覽器不支援錄製影片，請改用「下載靜態圖」，或用電腦版 Chrome 開啟。';return;}

const SKY=(function(){
  const api={boost(){}};
  if(reduce) return api;
  const c=$('#sky'),x=c.getContext('2d');let W,H,items=[],dots=[],mine=0;
  const mk=()=>{const z=Math.random();return {x:Math.random()*W,y:Math.random()*H,z,s:14+z*56,v:.08+z*.32,n:1+Math.floor(Math.random()*9),f:Math.random()<.55,p:Math.random()*6.28,r:(Math.random()-.5)*.5,a:.04+z*.14};};
  function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    items=Array.from({length:Math.max(18,Math.round(W*H/26000))},mk).sort((a,b)=>a.z-b.z);
    dots=Array.from({length:Math.round(W*H/40000)},()=>({x:Math.random()*W,y:Math.random()*H,p:Math.random()*6.28,s:1+Math.random()*2.5}));}
  function frame(){
    x.clearRect(0,0,W,H);x.textAlign='center';x.textBaseline='middle';
    for(const o of items){o.y-=o.v;o.p+=.01;if(o.y<-60){o.y=H+60;o.x=Math.random()*W;o.n=mine&&Math.random()<.35?mine:1+Math.floor(Math.random()*9);}
      const me=mine&&o.n===mine;
      x.save();x.translate(o.x+Math.sin(o.p)*10,o.y);x.rotate(o.r*Math.sin(o.p*.5));
      x.globalAlpha=(me?o.a*1.6:o.a)*(.65+.35*Math.sin(o.p*1.7));x.fillStyle=me?'#f3d58a':'#eac063';
      if(me){x.shadowColor='rgba(234,192,99,.6)';x.shadowBlur=12;}
      x.font=o.f?`${o.s}px ${MARKF}`:`900 ${o.s*.78}px ${SANS}`;x.fillText(o.n,0,0);x.restore();}
    for(const s of dots){s.p+=.03;const a=Math.max(0,Math.sin(s.p));x.globalAlpha=a*.7;x.fillStyle='#fff3cf';x.beginPath();x.arc(s.x,s.y,s.s*a,0,7);x.fill();}
    x.globalAlpha=1;requestAnimationFrame(frame);}
  size();addEventListener('resize',size);frame();
  api.boost=n=>{mine=n;if(n)items.forEach(o=>{if(Math.random()<.3)o.n=n;});};
  return api;
})();

function compat(n){
  const g=GROUP[n],order=['mind','earth','heart'];
  const rate=m=>{if(m===n)return 4;if(GROUP[m]===g)return 5;const k=[g,GROUP[m]].sort((x,y)=>order.indexOf(x)-order.indexOf(y)).join('-');return k==='mind-earth'?3:4;};
  return [1,2,3,4,5,6,7,8,9].map(m=>[m,rate(m)]);
}

const tabBtn=(g,k,label,sel,cls='')=>`<button type="button" role="tab" id="tb-${g}-${k}" aria-controls="tp-${g}-${k}" data-tab="${g}:${k}" aria-selected="${sel}" tabindex="${sel?0:-1}"${cls?` class="${cls}"`:''}>${label}</button>`;
const tabs=(g,list,extra='',label='')=>`<div class="tabs${extra}" role="tablist"${label?` aria-label="${label}"`:''}>${list.map(([k,l,cls],i)=>tabBtn(g,k,l,i===0,cls)).join('')}</div>`;
const panel=(g,k,html,first)=>`<div role="tabpanel" id="tp-${g}-${k}" aria-labelledby="tb-${g}-${k}" tabindex="0" data-panel="${g}:${k}"${first?'':' hidden'}>${html}</div>`;

function gridHTML(){
  const c=S.cnt,W=300,cell=100,cx=i=>i*cell+cell/2,has=k=>c[k]>0;
  const got=LINES.filter(l=>l[0].every(has));
  let svg=`<svg viewBox="0 0 ${W} ${W}" role="img" aria-label="生命靈數九宮格，有出現的數字：${[1,2,3,4,5,6,7,8,9].filter(has).join('、')||'無'}">`;
  for(const k in POS){const [x,y]=POS[k];svg+=`<rect class="cellbg" x="${x*cell+6}" y="${y*cell+6}" width="${cell-12}" height="${cell-12}" rx="12"/>`;}
  got.forEach((l,i)=>{
    const [a,,b]=l[0].map(k=>POS[k]).sort((p,q)=>p[0]-q[0]||p[1]-q[1]);
    const x1=cx(a[0]),y1=cx(a[1]),x2=cx(b[0]),y2=cx(b[1]),L=Math.hypot(x2-x1,y2-y1);
    svg+=`<line class="lnk draw" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="--L:${L.toFixed(0)};--d:${(0.5+i*0.25).toFixed(2)}s"/>`;
  });
  let i=0;
  for(const k of [1,2,3,4,5,6,7,8,9]){
    const [x,y]=POS[k],X=cx(x),Y=cx(y),on=has(k);
    svg+=`<g class="gp" style="--d:${(i++*0.05).toFixed(2)}s">`;
    if(on) svg+=`<circle class="cir" cx="${X}" cy="${Y}" r="27" fill="#fff"/>`;
    svg+=`<text class="dg ${on?'on':'off'}" x="${X}" y="${Y}">${k}</text>`;
    if(c[k]>1) svg+=`<circle class="cntbg" cx="${X+24}" cy="${Y-24}" r="11"/><text class="cnt" x="${X+24}" y="${Y-24}">×${c[k]}</text>`;
    svg+='</g>';
  }
  svg+='</svg>';
  const present=[1,2,3,4,5,6,7,8,9].filter(has),missing=[1,2,3,4,5,6,7,8,9].filter(k=>!has(k));
  const lines=got.length
    ?got.map(l=>`<div class="lnc"><div class="lnh"><span class="lnd" aria-label="${l[0].join('、')}">${l[0].map(k=>`<i style="--c:${LUCK[k].hex};--fg:${LUCK[k].fg}">${k}</i>`).join('<em></em>')}</span><b>${l[1]}</b></div><p>${l[2]}</p></div>`).join('')
    :'<p class="none">你的九宮格沒有完整連線，代表能量比較分散、不被單一模式定義。可以點下面的「少的數」，看看要補哪些能量。</p>';
  const haveCards=present.map(k=>{const L=LUCK[k],n=c[k],h=HAVE[k];
    const lvl=n>=3?['能量很強','strong']:n===2?['能量加倍','dbl']:['擁有','one'];
    return `<div class="mc hc" style="--c:${L.hex};--fg:${L.fg}">
      <div class="mt"><span class="mn">${k}</span><div class="mh"><b>有 ${k}${n>1?` ×${n}`:''}・${DG[k].kw}</b><small>${lvl[0]}・代表色 ${L.name}</small></div><span class="dots" aria-label="出現 ${n} 次">${'●'.repeat(Math.min(n,5))}</span></div>
      <div class="mb"><span class="ml">你的強項</span><p>${h.plus}</p>${n>=3?`<p class="warn"><b>要小心：</b>${h.over}</p>`:n===2?`<p class="plus2">出現 2 次，這份特質在你身上特別明顯，是別人一眼就看得到的你。</p>`:''}</div></div>`;}).join('');
  const missCards=missing.length?missing.map((k,j)=>{const L=LUCK[k];return `<div class="mc" style="--c:${L.hex};--fg:${L.fg}">
      <div class="mt"><span class="mn">${k}</span><div class="mh"><b>少了 ${k}・補${L.name}</b><small>${L.eff}</small></div></div>
      <div class="mb"><span class="ml">推薦水晶</span><div class="gems">${gemsHTML(L.crys,gemColor(k),j*.3)}</div><p>${MISS[k].replace(/^少了 \d：/,'')}</p></div></div>`;}).join('')
    :'<p class="none">1 到 9 你全都有，九宮格滿格！各種能量都有一點，是很全面的人。</p>';
  return `<section class="panel fade" style="--i:1" aria-labelledby="h-grid">${idx(2)}
    <p class="eyebrow">BIRTH CHART</p>
    <h2 id="h-grid">你的九宮格</h2>
    <p class="sub">把生日和計算過程裡的數字圈起來，連成一線的地方就是你的天賦。</p>
    <div class="gridwrap">
      <div class="nine">${svg}</div>
      <div class="lines"><span class="lh">你的連線（${got.length} 條）</span>${lines}</div>
    </div>
    <div class="orn">圈起來的數字・空缺的數字</div>
    ${tabs('g',[['have',`有的數（${present.length}）`],['miss',`少的數（${missing.length}）`]])}
    ${panel('g','have',`<p class="tabnote">被圈起來的數字是你天生就有的能量，出現越多次越明顯。</p><div class="missgrid">${haveCards}</div>`,true)}
    ${panel('g','miss',`<p class="tabnote">空缺的數字是比較需要練習的能量，可以用對應的顏色（衣服、小物、手機桌布）或隨身水晶來補。水晶僅供參考，不需要全部買齊，挑一顆有眼緣的就好。</p><div class="missgrid">${missCards}</div>`)}
    <p class="howto">九宮格排法：上排 3・6・9、中排 2・5・8、下排 1・4・7；0 不列入。</p>
  </section>`;
}

/* ---------- 手機：輸入時收起預約列，並把輸入框捲到看得見的地方 ---------- */
(function(){
  const isField=el=>el&&(el.tagName==='INPUT'||el.tagName==='SELECT'||el.tagName==='TEXTAREA');
  document.addEventListener('focusin',e=>{
    if(!isField(e.target)) return;
    document.body.classList.add('typing');
    if(e.target.tagName!=='SELECT') setTimeout(()=>{try{e.target.scrollIntoView({block:'center',behavior:'smooth'});}catch(_){}} ,350);
  });
  document.addEventListener('focusout',()=>setTimeout(()=>{if(!isField(document.activeElement))document.body.classList.remove('typing');},120));
  if(window.visualViewport){const vv=window.visualViewport;vv.addEventListener('resize',()=>{const kb=vv.height<window.innerHeight*.78;document.body.classList.toggle('kb',kb);});}
})();

/* ---------- 彩蛋：乾一杯（龍舌蘭杯＋鹽巴＋玻璃敲擊聲） ---------- */
(function(){
  const b=$('#cheers'),tx=$('#ctext'),orig=tx.innerHTML;let busy=false,AC=null;
  const HIT1=.385,HIT2=.66; // 對應 clink 動畫 35%、60% 的碰杯時刻（1.1s）
  function clinkSound(){
    try{
      AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
      const hit=(t0,g)=>{
        [[2380,1,1.5],[3910,.55,1.1],[5480,.32,.8],[7350,.16,.5],[2960,.25,1.2]].forEach(([f,a,d])=>{
          const o=AC.createOscillator(),v=AC.createGain();o.type='sine';o.frequency.value=f*(1+(Math.random()-.5)*.006);
          v.gain.setValueAtTime(0,t0);v.gain.linearRampToValueAtTime(a*g*.2,t0+.003);v.gain.exponentialRampToValueAtTime(.0001,t0+d);
          o.connect(v).connect(AC.destination);o.start(t0);o.stop(t0+d+.05);});
        const len=Math.floor(AC.sampleRate*.025),buf=AC.createBuffer(1,len,AC.sampleRate),dd=buf.getChannelData(0);
        for(let i=0;i<len;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
        const src=AC.createBufferSource(),hp=AC.createBiquadFilter(),gv=AC.createGain();src.buffer=buf;hp.type='highpass';hp.frequency.value=3500;gv.gain.value=.22*g;
        src.connect(hp).connect(gv).connect(AC.destination);src.start(t0);
      };
      const t=AC.currentTime;hit(t+HIT1,1);hit(t+HIT2,.4);
    }catch(e){}
  }
  function salt(){
    const bb=b.getBoundingClientRect(),sv=b.querySelector('svg').getBoundingClientRect();
    const cx=sv.left-bb.left+sv.width/2,cy=sv.top-bb.top+sv.height*.2;
    for(let i=0;i<30;i++){
      const p=document.createElement('i');p.className=i<6?'pt':'salt';p.style.left=cx+'px';p.style.top=cy+'px';b.appendChild(p);
      const dir=(Math.random()-.5)*2,vx=dir*(20+Math.random()*50),up=-(10+Math.random()*26),fall=60+Math.random()*70,rot=Math.random()*360;
      const kf=[0,.2,.45,.7,1].map(k=>({transform:`translate(calc(-50% + ${vx*k}px),calc(-50% + ${up*4*k*(1-k)+fall*k*k}px)) rotate(${rot*k}deg) scale(${i<6?1-k*.8:1-k*.3})`,opacity:k<.7?1:1-(k-.7)/.3}));
      p.animate(kf,{duration:900+Math.random()*600,delay:HIT1*1000-20,easing:'linear',fill:'both'}).onfinish=()=>p.remove();
    }
  }
  b.addEventListener('click',()=>{
    if(busy) return;busy=true;
    clinkSound();
    tx.textContent=S?`叮！敬 ${S.life} 號人！`:'叮！乾杯！';
    if(!reduce){b.classList.remove('on');void b.offsetWidth;b.classList.add('on');salt();}
    setTimeout(()=>{tx.innerHTML=orig;b.classList.remove('on');busy=false;},reduce?1400:2200);
  });
})();
